title: Monash Working Paper Format Template
author: Rob J Hyndman
version: 2.1.0
quarto-required: ">= 1.4.0"
contributes:
  formats:
    common:
      papersize: a4
      fontsize: 11pt
      date: today
      date-format: "D MMMM YYYY"
      toc: false
      number-sections: true
      number-depth: 2
      linestretch: 1.5
      fig-height: 5
      fig-width: 8
      ligatures: false
      knitr:
        opts_chunk:
          echo: false
          warning: false
          message: false
      format-resources:
        - monash2.png
        - MBSportrait.jpg
        - EQUIS.png
        - AMBA.png
        - AACSB.png
    pdf:
      documentclass: article
      pdf-engine: xelatex
      geometry:
      - top=2.4cm
      - bottom=2.4cm
      - left=2.5cm
      - right=2.5cm
      block-headings: false
      cite-method: biblatex
      biblio-style: authoryear-comp
      colorlinks: true
      template-partials:
        - "before-title.tex"
        - "title.tex"
      format-resources:
        - hack/tex/latex/hack/hack.sty
        - hack/tex/latex/hack/t1hack.fd
        - hack/fonts/map/dvips/hack/hack.map
        - hack/fonts/enc/dvips/hack/hack-t1.enc
        - hack/fonts/tfm/public/hack/hackr8t.tfm
        - hack/fonts/tfm/public/hack/hackr8t--base.tfm
        - hack/fonts/tfm/public/hack/hackb8t.tfm
        - hack/fonts/tfm/public/hack/hackb8t--base.tfm
        - hack/fonts/tfm/public/hack/hacki8t.tfm
        - hack/fonts/tfm/public/hack/hacki8t--base.tfm
        - hack/fonts/tfm/public/hack/hackbi8t.tfm
        - hack/fonts/tfm/public/hack/hackbi8t--base.tfm
        - hack/fonts/vf/public/hack/hackr8t.vf
        - hack/fonts/vf/public/hack/hackb8t.vf
        - hack/fonts/vf/public/hack/hacki8t.vf
        - hack/fonts/vf/public/hack/hackbi8t.vf
        - hack/fonts/truetype/public/hack/Hack-Regular.ttf
        - hack/fonts/truetype/public/hack/Hack-Bold.ttf
        - hack/fonts/truetype/public/hack/Hack-Italic.ttf
        - hack/fonts/truetype/public/hack/Hack-BoldItalic.ttf
        - hack/fonts/truetype/public/hack/HackFCLigaturedCCG-Regular.ttf
        - hack/fonts/truetype/public/hack/HackFCLigaturedCCG-Bold.ttf
        - hack/fonts/truetype/public/hack/HackFCLigaturedCCG-Italic.ttf
        - hack/fonts/truetype/public/hack/HackFCLigaturedCCG-BoldItalic.ttf
    typst:
      template-partials:
        - typst-template.typ
        - typst-show.typ
      lang: en
      region: AU
      bibliographystyle: apa
      margin:
        top: 2.4cm
        bottom: 2.4cm
        left: 2.5cm
        right: 2.5cm
      font-paths:
        - fonts
        - hack/fonts/truetype/public/hack
